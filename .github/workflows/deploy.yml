name: deploy

# The guides live in this repository and the website (intuitums/web) renders
# them at build time. Without this, a merged guide would wait for the next
# website change to appear, so start the website's deploy instead.
on:
  push:
    branches: [main]
    paths: ["docs/guides/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the website's deploy
        env:
          # A fine-grained token limited to intuitums/web with Actions: write.
          GH_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure WEB_DEPLOY_TOKEN to redeploy intuitums/web.'; exit 1; }
          gh workflow run deploy.yml --repo intuitums/web --ref main
