name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Docs-only changes can't affect the binary or the test suite, so they
    # skip the heavy jobs — but the required checks must still report green,
    # so Build & Test and Performance stay running and short-circuit their
    # steps instead of skipping themselves.
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push path diffs the squash commit against its parent.
          fetch-depth: 2

      - name: Gate
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # On a pull request the file list comes from the API; on a push —
          # the squash merge itself — from the diff against the parent.
          # A listing failure is fail-open: the heavy jobs run. CI is never
          # skipped on uncertainty.
          if [ -n "$PR" ]; then
            if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | (.filename, .previous_filename // empty)'); then
              echo "file listing failed; running the heavy jobs"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "packages=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            files=$(git diff --name-only HEAD^ HEAD)
          fi
          # Paths that cannot affect the binary or the tests: prose, record
          # files, repository metadata. Anything unlisted runs the heavy
          # jobs — an unfamiliar path errs toward testing, not skipping.
          build=false
          packages=false
          while IFS= read -r file; do
            # Installer jobs cover package generation, launchers, and ownership.
            case "$file" in
              packaging/* | scripts/packaging/* | install.sh | LICENSE | \
              src/core/update.rs | tests/update.rs | scripts/release-check.sh | \
              .github/workflows/ci.yml | .github/workflows/release.yml)
                packages=true ;;
            esac
            case "$file" in
              *.md | README | docs/* | LICENSE | CHANGELOG.md | \
              benchmarks/results/* | .gitignore | .gitattributes | .editorconfig | \
              .github/pull_request_template.md | .github/CODEOWNERS | \
              .github/dependabot.yml) ;;
              *) build=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  guard:
    # Audit the security surface before running the repository contract.
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit
        run: ./scripts/guard.sh

  test:
    # Run the repository contract on fresh GitHub-hosted Linux and macOS VMs.
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        if: needs.changes.outputs.build == 'true'
        run: rustc --version

      - name: Check
        if: needs.changes.outputs.build == 'true'
        run: ./x check

      - name: Frames
        if: needs.changes.outputs.build == 'true'
        run: ./x ui --out "$RUNNER_TEMP/e-ui-frames"

      - name: Retain frames
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-frames-${{ runner.os }}
          path: ${{ runner.temp }}/e-ui-frames
          if-no-files-found: ignore
          retention-days: 7

  performance:
    name: Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        if: needs.changes.outputs.build == 'true'
        run: rustc --version

      - name: Bench
        if: needs.changes.outputs.build == 'true'
        run: ./x bench

      # A reviewer convenience, not a contract: GitHub's artifact service
      # occasionally 403s at finalize, and that flake must not fail the job.
      - name: Upload binary
        if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Verify package contents and native launchers
        run: |
          python3 -m unittest discover -s scripts/packaging -p 'test_*.py'
          node --test scripts/packaging/publish-npm.test.mjs
          scripts/packaging/smoke.sh
