name: ci

# Every job runs the ./x command it is named after, so CI and local checks
# share one definition of passing. `changes` decides which jobs a change
# needs; the rest are skipped whole, and `ready` is the one required check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.filter.outputs.plan }}
      build: ${{ steps.filter.outputs.build }}
      packages: ${{ steps.filter.outputs.packages }}
      channels: ${{ steps.filter.outputs.channels }}
      docs: ${{ steps.filter.outputs.docs }}
      lock: ${{ steps.filter.outputs.lock }}
      ui: ${{ steps.filter.outputs.ui }}
      crates: ${{ steps.filter.outputs.crates }}
      glibc: ${{ steps.filter.outputs.glibc }}
      site: ${{ steps.filter.outputs.site }}
      python: ${{ steps.filter.outputs.python }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/changes.py

  lint:
    # Content, formatting, and the guard run on every change; clippy only when
    # Rust compilation can change.
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check changed content
        run: python3 scripts/hooks/check.py HEAD^
      - name: Format
        run: ./x fmt --check
      - name: Guard and tooling tests
        run: ./x guard
      - name: Workflow syntax and security
        run: ./x workflows
      - name: Rust cache
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Clippy
        if: needs.changes.outputs.build == 'true'
        run: ./x lint

  test-linux:
    # The suite. `./x test` runs every test binary even after one fails, so a
    # red pull request reports all of them.
    name: test (linux)
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['test-linux']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x test

  test-macos:
    # The suite. `./x test` runs every test binary even after one fails, so a
    # red pull request reports all of them.
    name: test (macos)
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['test-macos']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x test

  ui:
    # The frames and colours are pinned against the reference design, which no
    # other job looks at.
    name: ui
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['ui']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x ui --out "$RUNNER_TEMP/e-ui-frames"
      - name: Retain frames
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-frames-${{ runner.os }}
          path: ${{ runner.temp }}/e-ui-frames
          if-no-files-found: ignore
          retention-days: 7

  docs:
    # The guides are published on the website and embedded in the binary. A
    # change to the binary gets the contract from `./x test`; a prose-only
    # change, which skips that, gets it here.
    name: docs
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['docs']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x docs

  packages-linux:
    # Installers and package launchers, on each platform they install to.
    name: packages (linux)
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['packages-linux']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: ./x packages

  packages-macos:
    # Installers and package launchers, on each platform they install to.
    name: packages (macos)
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['packages-macos']
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: ./x packages

  crates:
    # The crates.io packages and the release's dependency inventory.
    name: crates
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['crates']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x crates
      - run: ./x sbom "$RUNNER_TEMP/e-sbom.cdx.json"

  channels:
    name: channels
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['channels']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: ./x channels
      - run: ./x audit-channels
      - name: Build the Slack image
        if: github.event_name != 'schedule'
        run: ./x container

  glibc:
    # The release's Linux image, so the floor is proven on the pull request
    # instead of by a user on an older distribution. Release plumbing and the
    # lockfile both decide it, because a dependency can raise the floor.
    name: glibc
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['glibc']
    runs-on: ubuntu-latest
    container:
      image: rust:1.98-bullseye
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/*/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-bullseye-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build for the oldest glibc the release promises
        env:
          TARGETS: x86_64-unknown-linux-gnu
          E_GLIBC_CEILING: "2.31"
        run: scripts/release/build.sh

  audit:
    # RustSec advisories, when the dependency set changes and weekly, so a CVE
    # in an existing pin still surfaces without a pull request.
    name: audit
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['audit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./x audit
      - run: ./x audit-python

  bench:
    name: bench
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['bench']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-v1-${{ runner.os }}-${{ runner.arch }}-host-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
      - run: ./x bench

      # A reviewer convenience, not a contract: GitHub's artifact service
      # occasionally 403s at finalize, and that flake must not fail the job.
      - name: Upload binary
        if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7

  site:
    name: site
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['site']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build the website with these guides
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./x site

  fuzz:
    name: fuzz-check
    needs: changes
    if: fromJSON(needs.changes.outputs.plan)['fuzz']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./x fuzz-check

  ready:
    name: ready
    needs: [changes, lint, test-linux, test-macos, ui, docs, site, packages-linux, packages-macos, crates, channels, glibc, audit, bench, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected checks and intended skips
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ready.py
