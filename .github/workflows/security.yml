name: Security

# Dependency advisories (RustSec) and the three fuzz targets. The audit runs
# when the dependency set changes and weekly, so a CVE in an existing pin still
# surfaces without a pull request; the fuzzers run on their own weekly schedule
# and never on a pull request.
on:
  schedule:
    - cron: "17 6 * * 1"
    - cron: "41 5 * * 3"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/cli/fuzz/Cargo.toml"
      - "crates/cli/fuzz/Cargo.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  fuzz:
    # A skipped job has no matrix expansion; put target names on the run step.
    name: Fuzz
    # Exercise each parser independently on a fresh GitHub-hosted VM.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [sse, extension_protocol, sanitize]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +nightly-2026-08-20 install cargo-fuzz --version 0.11.0 --locked

      - name: Fuzz - ${{ matrix.target }}
        working-directory: crates/cli
        run: cargo +nightly-2026-08-20 fuzz run "${{ matrix.target }}" -- -max_total_time=120 -rss_limit_mb=2048
