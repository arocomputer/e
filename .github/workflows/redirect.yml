name: Legacy domain redirect

on:
  pull_request:
    paths: ["services/redirect/**", ".github/workflows/redirect.yml"]
  push:
    branches: [main]
    paths: ["services/redirect/**", ".github/workflows/redirect.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Redirect test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node --test services/redirect/worker.test.mjs
  deploy:
    name: Deploy redirect
    needs: check
    # The Aro /e site must be live first or these domains would redirect in a loop.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npx --yes wrangler@4.135.0 deploy --config services/redirect/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
