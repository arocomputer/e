name: checks

# Each job is one guarantee, and the names say which. They call `./x <step>`,
# the same steps `./x check` runs in order, so a failure points at one thing
# instead of "the check".
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job in this repo needs write access to anything.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which layers have anything to do. A docs-only change still runs
    # the fast layers and the docs contract; the heavy ones report their names
    # and short-circuit their steps, because a required check must report even
    # when it has nothing to do.
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      packages: ${{ steps.filter.outputs.packages }}
      channels: ${{ steps.filter.outputs.channels }}
      docs: ${{ steps.filter.outputs.docs }}
      lock: ${{ steps.filter.outputs.lock }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push path diffs the squash commit against its parent.
          fetch-depth: 2

      - name: Gate
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # On a pull request the file list comes from the API; on a push —
          # the squash merge itself — from the diff against the parent.
          # A listing failure is fail-open: the heavy jobs run. CI is never
          # skipped on uncertainty.
          if [ -n "$PR" ]; then
            if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | (.filename, .previous_filename // empty)'); then
              echo "file listing failed; running every layer"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "packages=true" >> "$GITHUB_OUTPUT"
              echo "channels=true" >> "$GITHUB_OUTPUT"
              echo "docs=true" >> "$GITHUB_OUTPUT"
              echo "lock=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            files=$(git diff --name-only HEAD^ HEAD)
          fi
          # Paths that cannot affect the binary or the tests: prose, record
          # files, repository metadata. Anything unlisted runs the heavy
          # jobs — an unfamiliar path errs toward testing, not skipping.
          build=false
          packages=false
          channels=false
          docs=false
          lock=false
          while IFS= read -r file; do
            # The reference channels have their own checks.
            case "$file" in
              channels/* | crates/cli/tests/fixtures/channels/* | .github/workflows/checks.yml) channels=true ;;
            esac
            # Installer jobs cover package generation, launchers, and ownership.
            case "$file" in
              scripts/packaging/* | scripts/release/* | crates/core/build.rs | install.sh | LICENSE | \
              crates/core/src/update.rs | crates/cli/tests/update.rs | scripts/release-check.sh | \
              .github/workflows/checks.yml | .github/workflows/release.yml | .github/workflows/preview.yml)
                packages=true ;;
            esac
            # A dependency can raise the glibc floor without touching release
            # plumbing, so the one container build also answers to the lockfile.
            case "$file" in
              Cargo.toml | crates/*/Cargo.toml | Cargo.lock) lock=true ;;
            esac
            # The guides are published to the website and embedded in the
            # binary, so a docs-only change still runs their contract.
            case "$file" in
              docs/* | contributing/* | README.md | CONTRIBUTING.md | AGENTS.md | \
              CLAUDE.md | SECURITY.md) docs=true ;;
            esac
            case "$file" in
              *.md | docs/* | LICENSE | CHANGELOG.md | \
              benchmarks/results/* | .gitignore | .gitattributes | .editorconfig | \
              .github/pull_request_template.md | .github/CODEOWNERS | \
              .github/dependabot.yml | channels/*) ;;
              *) build=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"

  fmt:
    # Formatting is platform-independent and costs seconds, so it runs once.
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        run: ./x fmt --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        if: needs.changes.outputs.build == 'true'
        run: ./x lint

  test:
    # The suite, on both supported platforms. `./x test` runs every test binary
    # even after one fails, so a red pull request reports all of them.
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        if: needs.changes.outputs.build == 'true'
        run: ./x test

  ui:
    # The frames and colours are pinned against the reference design, which no
    # other job looks at.
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Frames
        if: needs.changes.outputs.build == 'true'
        run: ./x ui --out "$RUNNER_TEMP/e-ui-frames"

      - name: Retain frames
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-frames-${{ runner.os }}
          path: ${{ runner.temp }}/e-ui-frames
          if-no-files-found: ignore
          retention-days: 7

  docs:
    # The guides are published to the docs site and embedded in the binary. A
    # change to the binary gets the contract from `./x test`; a prose-only
    # change, which skips that, gets it here, and every docs change builds the
    # site.
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docs contract
        if: needs.changes.outputs.docs == 'true'
        run: ./x docs

      - name: Setup Node.js
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Docs site
        if: needs.changes.outputs.docs == 'true'
        run: ./x site

  crates:
    # The crates.io packages: the application is packaged and built end to end,
    # and the SDK's file list is checked.
    name: crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Published crates
        if: needs.changes.outputs.build == 'true'
        run: ./x crates

  guard:
    # The trust boundary, the repository's own tooling tests, and the gates that
    # keep a commit's content honest. Runs on every pull request, prose included.
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check changed content
        run: python3 scripts/hooks/check.py HEAD^

      - name: Audit and tooling tests
        run: ./x guard

  installers:
    name: installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Package contents and native launchers
        if: needs.changes.outputs.packages == 'true'
        run: ./x packages

  channels:
    name: channels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.channels == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Reference channels
        run: ./x channels

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.channels == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image installs the released e and this commit's bot, which is what
      # an operator gets; nothing else builds it before a server runs it.
      - name: Build the Slack image
        run: ./x container

  glibc:
    # The release's Linux image, so the floor is proven on the pull request
    # instead of by a user on an older distribution. Release plumbing and the
    # lockfile both decide it, because a dependency can raise the floor.
    name: glibc
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.lock == 'true'
    runs-on: ubuntu-latest
    container:
      image: rust:1.98-bullseye
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for the oldest glibc the release promises
        env:
          TARGETS: x86_64-unknown-linux-gnu
          E_GLIBC_CEILING: "2.31"
        run: scripts/release/build.sh

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bench
        if: needs.changes.outputs.build == 'true'
        run: ./x bench

      # A reviewer convenience, not a contract: GitHub's artifact service
      # occasionally 403s at finalize, and that flake must not fail the job.
      - name: Upload binary
        if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number }}
          path: target/release/e
          if-no-files-found: error
          retention-days: 7
