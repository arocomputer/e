name: cache-cleanup

on:
  # Trusted default-branch code only; never checkout or execute the PR head.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- only deletes numbered merge-ref caches
    types: [closed]

permissions: {}

concurrency:
  group: cache-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete closed PR caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cleanup.py
