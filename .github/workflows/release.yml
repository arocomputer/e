name: release

# Publication stays off during development unless explicitly enabled in repository variables.
# Preview builds are unsigned artifacts from the preview workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Retry existing release packages for a published tag
        type: choice
        options: [retry]
        default: retry
      tag:
        description: Existing version tag for a package retry
        type: string

permissions: {}

concurrency:
  group: release-publishing
  queue: max
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    if: github.repository == 'arocomputer/e' && vars.RELEASE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires push access to inspect unpublished draft releases.
      contents: write
    outputs:
      repository: ${{ steps.release.outputs.repository }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      title: ${{ steps.release.outputs.title }}
      channel: ${{ steps.release.outputs.channel }}
      command: ${{ steps.release.outputs.command }}
      sha: ${{ steps.release.outputs.sha }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/resolve.py
  verify:
    name: verify
    needs: resolve
    if: needs.resolve.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check selected source
        run: |
          ./x check
          ./x ui

      - name: Verify release identity
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          E_BUILD_CHANNEL="$CHANNEL" ./x release-check "$TAG"

  draft:
    name: draft
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Draft
        env:
          TITLE: ${{ needs.resolve.outputs.title }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Release is already published; use action=retry to retry packages without rebuilding.'; exit 1; }
          else
            gh release create "$TAG" --draft --target "$SHA" --title "$TITLE" --notes-file notes.md
          fi

  build-macos:
    name: build-macos
    needs: [resolve, draft]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build
        env:
          E_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          E_BUILD_CHANNEL: ${{ needs.resolve.outputs.channel }}
          E_BUILD_COMMIT: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          # A macOS runner's libc is not a Linux floor; scripts/release/build.sh
          # checks the glibc ceiling on the Linux legs instead.
          TARGETS: aarch64-apple-darwin x86_64-apple-darwin
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: scripts/release/build.sh

      - name: Retain build archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-macos
          path: e-*.tar.gz
          retention-days: 14
          overwrite: true

  build-linux:
    name: build-linux (${{ matrix.leg }})
    needs: [resolve, draft]
    runs-on: ${{ matrix.runner }}
    # A Linux binary links against the glibc of the image that built it, so it
    # is built where that glibc is oldest: Debian 11 ships 2.31, which covers
    # Debian 11 and 12, Ubuntu 22.04 and 24.04, and RHEL 9. Building on
    # `ubuntu-latest` instead put the floor at that runner's 2.39 and left the
    # older half of our users with a binary that would not start.
    container:
      image: rust:1.98-bullseye
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: x86_64
            runner: ubuntu-latest
            targets: "x86_64-unknown-linux-gnu"
          - leg: arm64
            runner: ubuntu-24.04-arm
            targets: "aarch64-unknown-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build
        env:
          E_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          E_BUILD_CHANNEL: ${{ needs.resolve.outputs.channel }}
          E_BUILD_COMMIT: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGETS: ${{ matrix.targets }}
          COMMAND: ${{ needs.resolve.outputs.command }}
          # Debian 11's glibc, and the floor `install.sh` refuses below.
          E_GLIBC_CEILING: "2.31"
        run: scripts/release/build.sh

      - name: Retain build archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-${{ matrix.leg }}
          path: e-*.tar.gz
          retention-days: 14
          overwrite: true

  github:
    name: github
    needs: [resolve, build-macos, build-linux]
    if: ${{ !cancelled() && ((needs.build-macos.result == 'success' && needs.build-linux.result == 'success') || needs.resolve.outputs.mode == 'recover') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep release tooling for older source commits
        run: |
          cp scripts/release/sbom.py "$RUNNER_TEMP/release-sbom.py"
          cp scripts/release/assets.py "$RUNNER_TEMP/release-assets-check.py"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download build archives
        if: needs.resolve.outputs.mode == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Download and checksum every artifact
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "$MODE" = recover ]; then
            gh release download "$TAG" --pattern "e-*.tar.gz" --dir "$RUNNER_TEMP/release-assets"
          fi
          cd "$RUNNER_TEMP/release-assets"
          test "$(find . -name 'e-*.tar.gz' | wc -l)" -eq 4
          sha256sum e-*.tar.gz > checksums.txt

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          python3 "$RUNNER_TEMP/release-sbom.py" "$RUNNER_TEMP/release-assets/e-sbom.cdx.json"

      - name: Record build identity
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; Path(os.environ["RUNNER_TEMP"], "release-assets", "build.json").write_text(json.dumps({"version": os.environ["VERSION"], "commit": os.environ["SOURCE_COMMIT"]}) + "\n")'

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Upload verified assets and publish
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/e-*.tar.gz "$RUNNER_TEMP/release-assets/checksums.txt" "$RUNNER_TEMP/release-assets/e-sbom.cdx.json" "$RUNNER_TEMP/release-assets/build.json" --clobber
          ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
          python3 scripts/release/notes.py notes.md "$TAG" "$SHA" > "$RUNNER_TEMP/release-assets/release.json"
          gh release upload "$TAG" "$RUNNER_TEMP/release-assets/release.json" --clobber
          python3 "$RUNNER_TEMP/release-assets-check.py" "$TAG"
          gh release edit "$TAG" --draft=false --latest

      - name: Retain verified assets for package publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-assets
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 14
          overwrite: true

  npm:
    name: npm
    needs: [resolve, github]
    if: ${{ !cancelled() && (needs.github.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    # Six packages may each need up to twenty minutes for npm processing.
    timeout-minutes: 110
    outputs:
      failure: ${{ steps.packages.outputs.failure }}
      verify: ${{ steps.verify.outcome }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Download verified assets
        if: needs.resolve.outputs.mode != 'retry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-assets
          path: ${{ runner.temp }}/npm-assets
      - name: Prepare verified packages
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ "$MODE" = retry ]; then
            test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
            gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir "$RUNNER_TEMP/npm-assets"
          fi
          python3 scripts/packaging/prepare.py "$TAG" "$RUNNER_TEMP/npm-assets" dist
      - name: Publish and verify npm packages
        id: packages
        run: node scripts/packaging/publish-npm.mjs dist --exclude=slack
      - name: Publish the Slack channel
        # The bot versions itself and publishes with production only. A bot publication
        # failure does not block the application's installers or their retries.
        continue-on-error: true
        run: node scripts/packaging/publish-npm.mjs dist --only=slack

      - name: Verify registry installation
        id: verify
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: sh scripts/packaging/verify-npm.sh

  container:
    name: container
    # The image installs the release it belongs to, so it waits for one.
    needs: [resolve, github]
    if: ${{ !cancelled() && needs.github.result == 'success' }}
    # A registry hiccup must not fail the release, the way the npm
    # publishing step does not. The deployment report still records the outcome.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/slack
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            E_VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ghcr.io/arocomputer/e-slack:latest
            ghcr.io/arocomputer/e-slack:${{ needs.resolve.outputs.version }}

  crates-verify:
    name: crates-verify
    needs: [resolve, github]
    if: ${{ !cancelled() && (needs.github.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and consumers without publication credentials
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cd source
          ./x check
          cd ..
          python3 tooling/scripts/release/registry.py --source source --tag "$TAG" --out staged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-registry
          path: staged
          if-no-files-found: error
          retention-days: 14

  crates:
    needs: [resolve, crates-verify]
    if: ${{ !cancelled() && needs.crates-verify.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-registry
          path: release
      # Upload bodies were prepared without credentials. No checkout or crate execution.
      - name: Verify archives and upload bodies
        run: |
          cd release
          sha256sum --check SHA256SUMS
      - name: Select unpublished packages and reject conflicting registry versions
        id: pending
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen
          source = json.loads(Path('release/source.json').read_text())
          if [p['name'] for p in source['packages']] != ['e-core', 'e-sdk']:
              raise ValueError('invalid SDK publication order')
          pending = []
          for package in source['packages']:
              name, version = package['name'], package['version']
              try:
                  with urlopen(f'https://index.crates.io/{name[:2]}/{name[2:4]}/{name}', timeout=30) as response:
                      entries = [json.loads(line) for line in response.read().decode().splitlines()]
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  entries = []
              existing = next((entry for entry in entries if entry['vers'] == version), None)
              if existing is None:
                  pending.append(name + ':' + version)
              else:
                  checksum = hashlib.sha256(Path(f'release/{name}-{version}.crate').read_bytes()).hexdigest()
                  if existing['yanked'] or existing['cksum'] != checksum:
                      raise ValueError(f'{name} {version} already exists with a different archive or is yanked')
                  print(f'{name} {version}: identical version already published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('packages=' + ' '.join(pending) + '\n')
          PY
      - id: auth
        if: steps.pending.outputs.packages != ''
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e
      - name: Publish core before dependent crates
        if: steps.pending.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGES: ${{ steps.pending.outputs.packages }}
        run: |
          for item in $PACKAGES; do
            package=${item%%:*}
            version=${item#*:}
            curl --fail-with-body --silent --show-error --max-time 60 --request PUT \
              --header "Authorization: $CARGO_REGISTRY_TOKEN" \
              --header 'Content-Type: application/octet-stream' --header 'Accept: application/json' \
              --data-binary "@release/$package-$version.publish" \
              https://crates.io/api/v1/crates/new --output response.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path('response.json').read_text())
          if response.get('errors'):
              raise ValueError(response['errors'])
          print(response.get('warnings', {}))
          PY
            # Wait for index visibility before a dependent package is uploaded.
            PACKAGE="$package" VERSION="$version" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError
          from urllib.request import urlopen
          name, version = os.environ['PACKAGE'], os.environ['VERSION']
          checksum = hashlib.sha256(Path(f'release/{name}-{version}.crate').read_bytes()).hexdigest()
          for attempt in range(60):
              try:
                  with urlopen(f'https://index.crates.io/{name[:2]}/{name[2:4]}/{name}', timeout=15) as response:
                      entries = [json.loads(line) for line in response.read().decode().splitlines()]
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  entries = []
              published = next((entry for entry in entries if entry['vers'] == version), None)
              if published is not None:
                  if published['cksum'] != checksum or published['yanked']:
                      raise ValueError('registry archive does not match the verified release')
                  break
              time.sleep(2)
          else:
              raise TimeoutError(f'{name} {version} did not appear in the index')
          PY
          done

  homebrew:
    name: homebrew
    permissions:
      contents: read
    needs: [resolve, github]
    if: ${{ !cancelled() && (needs.github.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare verified formula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.resolve.outputs.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir "$RUNNER_TEMP/brew-assets"
          python3 scripts/packaging/prepare.py "$TAG" "$RUNNER_TEMP/brew-assets" dist
      - name: Check publishing access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN before publishing.'; exit 1; }
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- tap publishing needs git push credentials
        with:
          repository: arocomputer/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish formula
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMAND: ${{ needs.resolve.outputs.command }}
        run: scripts/packaging/publish-brew.sh "dist/$COMMAND.rb" tap

  installer:
    name: installer
    needs: [resolve, github]
    if: ${{ !cancelled() && (needs.github.result == 'success' || needs.resolve.outputs.mode == 'retry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify website installer
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          curl -fsSL --retry 3 https://e.aro.computer/install.sh -o "$RUNNER_TEMP/install.sh"
          E_INSTALL_DIR="$RUNNER_TEMP/e-pinned" sh "$RUNNER_TEMP/install.sh" --version "${TAG#v}"
          "$RUNNER_TEMP/e-pinned/e" --version | grep -Fx "e ${TAG#v}"

  report:
    name: report
    needs: [resolve, verify, draft, build-macos, build-linux, github, npm, homebrew, container, crates-verify, crates, installer]
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      # Reporting uses this workflow's code, while the deployment records the selected release SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record channel outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/release/deployment.py
