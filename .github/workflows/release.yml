name: Release

# A version tag qualifies and builds four release binaries, then publishes
# checksums, an SBOM, and build provenance, then updates the package installers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Retry package publishing for an existing stable release (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  qualify:
    if: github.event_name == 'push'
    name: Qualify tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify
        run: |
          ./x check
          ./x release-check "${{ github.ref_name }}"

  create:
    name: Draft release
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Publish exactly this version's summary and grouped changes.
          ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md

  build:
    name: Build (${{ matrix.runner }})
    needs: create
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - runner: ubuntu-latest
            targets: "x86_64-unknown-linux-gnu"
          - runner: ubuntu-24.04-arm
            targets: "aarch64-unknown-linux-gnu"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked --target "$target"
            tar czf "e-$target.tar.gz" -C "target/$target/release" e
            gh release upload "$TAG" "e-$target.tar.gz" --clobber
          done

          host=$(rustc -vV | sed -n 's/^host: //p')
          case " ${{ matrix.targets }} " in
            *" $host "*)
              "target/$host/release/e" --version | grep -Fx "e ${TAG#v}"
              sha256sum "e-$host.tar.gz" > checksums.txt 2>/dev/null || \
                shasum -a 256 "e-$host.tar.gz" > checksums.txt
              install_dir=$(mktemp -d)
              E_RELEASE_BASE="file://$PWD" E_INSTALL_DIR="$install_dir" ./install.sh
              "$install_dir/e" --version | grep -Fx "e ${TAG#v}"
              ;;
          esac

  publish:
    name: Checksums and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and checksum every artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern "e-*.tar.gz"
          sha256sum e-*.tar.gz > checksums.txt

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5
          # cargo-cyclonedx names the BOM after the crate (e.cdx.json), not bom.json.
          mv e.cdx.json assets/e-sbom.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Upload metadata and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" assets/checksums.txt assets/e-sbom.cdx.json --clobber
          gh release edit "$TAG" --draft=false

  npm:
    name: npm and Bun
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: npm-publishing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Prepare verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["TAG"])'
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir assets
          python3 scripts/packaging/prepare.py "$TAG" assets dist
      - name: Publish and verify npm packages
        env:
          # Remove this secret after all five packages trust this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/packaging/publish-npm.mjs dist

  homebrew:
    name: Homebrew tap
    permissions:
      contents: read
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: homebrew-publishing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Prepare verified formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["TAG"])'
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$TAG" --pattern 'e-*.tar.gz' --pattern checksums.txt --dir assets
          python3 scripts/packaging/prepare.py "$TAG" assets dist
      - name: Check publishing access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN before publishing.'; exit 1; }
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: intuitums/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Publish formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/packaging/publish-brew.sh dist/e.rb tap

  website-installer:
    name: Public installer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install the published release through the website
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL --retry 3 https://e.intuitum.sh/install.sh -o "$RUNNER_TEMP/install.sh"
          E_RELEASE_BASE="https://github.com/intuitums/e/releases/download/$TAG" \
            E_INSTALL_DIR="$RUNNER_TEMP/e-install" sh "$RUNNER_TEMP/install.sh"
          "$RUNNER_TEMP/e-install/e" --version | grep -Fx "e ${TAG#v}"
