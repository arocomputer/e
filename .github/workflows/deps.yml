name: Dependency updates

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:


concurrency:
  group: deps-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.capture.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
      - run: cargo update
      - run: cargo update --manifest-path fuzz/Cargo.toml
      - run: npm ci
        working-directory: services/slack
      - name: Update Slack minor and patch versions
        run: npx --yes npm-check-updates@23.1.1 --target minor --upgrade && npm install --package-lock-only
        working-directory: services/slack
      - run: npm ci
        working-directory: services/slack
      - name: Check the updated dependencies
        run: ./x check
      - name: Capture checked dependency changes
        id: capture
        run: |
          files=(Cargo.lock fuzz/Cargo.lock services/slack/package.json services/slack/package-lock.json)
          if git diff --quiet -- "${files[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --binary -- "${files[@]}" > "$RUNNER_TEMP/dependency-update.patch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.capture.outputs.changed == 'true'
        with:
          name: dependency-update
          path: ${{ runner.temp }}/dependency-update.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-update
          path: ${{ runner.temp }}
      - name: Publish only the checked dependency patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='chore/dependency-updates'
          owner="${GITHUB_REPOSITORY%%/*}"
          prs=$(gh pr list --state open --base main --head "$owner:$branch" --json number,author)
          pr_count=$(jq 'length' <<< "$prs")
          pr_number=$(jq -r '[.[] | select(.author.login == "github-actions[bot]" or .author.login == "app/github-actions")][0].number // empty' <<< "$prs")
          remote_ref="refs/heads/$branch"
          gh auth setup-git
          remote_refs=$(git ls-remote origin "$remote_ref")
          remote_sha=$(awk 'NR == 1 { print $1 }' <<< "$remote_refs")
          if [ "$pr_count" -gt 0 ] && [ -z "$pr_number" ]; then
            echo 'The reserved dependency branch has an open PR not created by this workflow.' >&2
            exit 1
          fi
          if [ "$pr_count" -eq 0 ] && [ -n "$remote_sha" ]; then
            echo 'The reserved dependency branch exists without an open updater PR; refusing to overwrite it.' >&2
            exit 1
          fi
          if [ -n "$pr_number" ] && gh pr view "$pr_number" --json commits \
              --jq '.commits[] | select(.messageHeadline != "chore: update dependencies") | .messageHeadline' | grep -q .; then
            echo 'The updater PR contains non-automation commits; refusing to replace them.' >&2
            exit 1
          fi
          git apply --cached --binary "$RUNNER_TEMP/dependency-update.patch"
          mapfile -d '' -t changed_files < <(git diff --cached --name-only -z)
          allowed_files=(Cargo.lock fuzz/Cargo.lock services/slack/package.json services/slack/package-lock.json)
          for file in "${changed_files[@]}"; do
            allowed=false
            for allowed_file in "${allowed_files[@]}"; do
              [ "$file" = "$allowed_file" ] && allowed=true
            done
            [ "$allowed" = true ] || { echo 'Update patch contains an unexpected path.' >&2; exit 1; }
          done
          [ -n "$(git diff --cached --name-only)" ] || { echo 'Update patch is empty.' >&2; exit 1; }
          [ -z "$(git diff --cached --summary)" ] || { echo 'Update patch changes file modes or types.' >&2; exit 1; }
          git diff --cached --check
          python3 - services/slack/package.json <<'PY'
          import json
          import subprocess
          import sys
          groups = {'dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'}
          for path in sys.argv[1:]:
              before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
              after = json.loads(subprocess.check_output(['git', 'show', f':{path}']))
              if any(before.get(key) != after.get(key) for key in before.keys() | after.keys() if key not in groups):
                  raise SystemExit(f'Unexpected non-dependency edit in {path}')
              for group in groups:
                  old, new = before.get(group, {}), after.get(group, {})
                  if old.keys() != new.keys() or any(not isinstance(v, str) for v in new.values()):
                      raise SystemExit(f'Unexpected dependency shape change in {path}')
          PY
          python3 - "${changed_files[@]}" "$RUNNER_TEMP/dependency-summary.md" <<'PY'
          import json
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          rows = set()

          def read_blob(spec):
              return subprocess.check_output(['git', 'show', spec], text=True)

          def add_changes(old, new):
              for name in old.keys() | new.keys():
                  before, after = old.get(name, []), new.get(name, [])
                  before = [before] if isinstance(before, str) else before
                  after = [after] if isinstance(after, str) else after
                  if before != after:
                      rows.add((name, ', '.join(before) or '—', ', '.join(after) or '—'))

          def cargo_versions(text):
              data = tomllib.loads(text)
              packages = {}
              for package in data.get('package', []):
                  key = package['name']
                  packages.setdefault(key, set()).add(package['version'])
              return {name: sorted(versions) for name, versions in packages.items()}

          def go_versions(text):
              packages, in_require = {}, False
              for line in text.splitlines():
                  line = line.split('//', 1)[0].strip()
                  if not line:
                      continue
                  if line == ')':
                      in_require = False
                      continue
                  if line.startswith('require '):
                      line = line[len('require '):].strip()
                      if line == '(':
                          in_require = True
                          continue
                  elif not in_require:
                      continue
                  fields = line.split()
                  if len(fields) >= 2 and fields[1].startswith('v'):
                      packages[fields[0]] = [fields[1]]
              return packages

          def pip_versions(text):
              return {m.group(1).lower().replace('_', '-'): [m.group(2)]
                      for line in text.splitlines()
                      if (m := re.match(r'^([A-Za-z0-9_.-]+)==([^\s;]+)', line))}

          for path in sys.argv[1:-1]:
              try:
                  before, after = read_blob(f'HEAD:{path}'), read_blob(f':{path}')
              except subprocess.CalledProcessError:
                  continue
              if path.endswith('package.json'):
                  old, new = json.loads(before), json.loads(after)
                  for group in ('dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'):
                      add_changes(old.get(group, {}), new.get(group, {}))
              elif path.endswith('Cargo.lock'):
                  add_changes(cargo_versions(before), cargo_versions(after))
              elif path.endswith('go.mod'):
                  add_changes(go_versions(before), go_versions(after))
              elif path.endswith('requirements.lock'):
                  add_changes(pip_versions(before), pip_versions(after))

          ordered = sorted(rows)
          lines = ['### Updated packages']
          if not ordered:
              lines.append('Lockfile changes were checked; no direct version changes were found.')
          else:
              lines.extend(['| Package | From | To |', '| --- | --- | --- |'])
              for name, before, after in ordered[:20]:
                  clean = lambda value: value.replace('|', r'\|')
                  lines.append(f'| `{clean(name)}` | `{clean(before)}` | `{clean(after)}` |')
              if len(ordered) > 20:
                  lines.extend(['', f'<details><summary>{len(ordered) - 20} additional package updates</summary>', '',
                                '| Package | From | To |', '| --- | --- | --- |'])
                  for name, before, after in ordered[20:]:
                      clean = lambda value: value.replace('|', r'\|')
                      lines.append(f'| `{clean(name)}` | `{clean(before)}` | `{clean(after)}` |')
                  lines.append('</details>')
              lines.extend(['', f'Total: {len(ordered)} package changes.'])
          Path(sys.argv[-1]).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -c core.hooksPath=/dev/null commit -m 'chore: update dependencies'
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="$remote_ref:$remote_sha" origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
          sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$branch"
          run_id=''
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch "$branch" --limit 20 \
              --json databaseId,headSha,event \
              --jq ".[] | select(.headSha == \"$sha\" and .event == \"workflow_dispatch\") | .databaseId" \
              | head -n 1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Could not find the validation run for the exact update commit.' >&2; exit 1; }
          gh run watch "$run_id" --exit-status
          body_file="$RUNNER_TEMP/dependency-pr-body.md"
          {
            cat <<EOF
          ## Grouped dependency update

          This PR contains compatible dependency updates produced by the scheduled updater.

          EOF
            cat "$RUNNER_TEMP/dependency-summary.md"
            cat <<EOF

          ### Validation
          - The repository check suite passed in the isolated update job.
          - GitHub Actions CI passed on the exact dependency-update commit $sha before publication.
          EOF
          } > "$body_file"
          if [ -z "$pr_number" ]; then
            gh pr create --base main --head "$branch" \
              --title 'chore: update dependencies' \
              --body-file "$body_file"
            pr_number=$(gh pr view "$branch" --json number --jq .number)
          else
            gh pr edit "$pr_number" --body-file "$body_file"
          fi
