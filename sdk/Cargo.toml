[package]
name = "e-sdk"
# The SDK's own version, independent of the application version. It stays
# 0.0.0 until the first release declares the semantic-versioning policy.
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "e's coding agent as a library: sessions, turns, one event stream"
publish = false

[dependencies]
e = { path = ".." }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
