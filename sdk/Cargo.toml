[package]
name = "e-sdk"
# One version for the application and the SDK: they are published together from
# one tag, so a version identifies a matching pair.
version.workspace = true
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "e's coding agent as a library: sessions, turns, one event stream"
documentation = "https://docs.rs/e-sdk"
homepage = "https://e.intuitum.sh"
repository = "https://github.com/intuitums/e"
readme = "README.md"
keywords = ["agent", "coding-agent", "llm", "ai"]
categories = ["development-tools", "api-bindings"]

[dependencies]
# `intuitum-e` is the application package (`e` is taken on crates.io); its
# library target is still `e`. Any 0.x is accepted because both crates publish
# from the same commit, so the matching app is always the one beside it.
e = { package = "intuitum-e", path = "..", version = "0" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
