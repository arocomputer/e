[package]
# The command and Rust library share the product name.
name = "e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The coding agent you can put anywhere"
documentation = "https://e.aro.computer/docs"
readme = "../../README.md"
keywords = ["agent", "coding-agent", "cli", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "e"

[[bin]]
name = "e"
path = "src/main.rs"

[dependencies]
e-core.workspace = true
e-tui.workspace = true
e-rpc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "io-std", "process", "signal"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "io-std", "process", "signal"] }
futures.workspace = true
uuid.workspace = true
sha2.workspace = true
libc.workspace = true
proptest.workspace = true
