[package]
# The command and Rust library share the product name.
name = "ulo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The coding agent you can put anywhere"
documentation = "https://ulo.sh/docs"
readme = "../../README.md"
keywords = ["agent", "coding-agent", "cli", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ulo"

[[bin]]
name = "ulo"
path = "src/main.rs"

[dependencies]
ulo-core.workspace = true
ulo-tui.workspace = true
ulo-rpc.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
sha2.workspace = true
libc.workspace = true
proptest.workspace = true
