[package]
# Named after the npm packages (`@intuitums/e` → `intuitums-e`, and the SDK
# mirrors it as `intuitums-e-sdk`); the library is still `e_sdk`.
name = "intuitums-e-sdk"
# The SDK's own version, not the application's: different crates in this
# repository change for different reasons, so an SDK release that breaks its API
# moves this and says so in the GitHub release notes, while the application's version
# tracks the release.
version = "0.0.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "e's coding agent as a library: sessions, turns, one event stream"
documentation = "https://docs.rs/intuitums-e-sdk"
homepage = "https://e.intuitum.sh"
repository = "https://github.com/intuitums/e"
readme = "README.md"
keywords = ["agent", "coding-agent", "llm", "ai"]
categories = ["development-tools", "api-bindings"]

[lib]
# The library keeps its own name: the docs, examples, and tests are written
# against `use e_sdk::…`, independent of the registry package name.
name = "e_sdk"
path = "src/lib.rs"

[dependencies]
# The SDK drives the core directly and never links a frontend. The core's Rust
# API is internal, so each SDK release pins the version it was built and
# tested against.
e-core = { package = "intuitums-e-core", path = "../core", version = "=0.0.1" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
# The integration tests share the application's test helpers, which reach the
# core through the `e` library. Consumers of the SDK never compile it.
e = { package = "intuitums-e", path = "../cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
