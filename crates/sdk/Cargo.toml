[package]
# The package is `ulo-sdk`; Rust consumers import `ulo_sdk`.
name = "ulo-sdk"
# The SDK's own version, not the application's: different crates in this
# repository change for different reasons, so an SDK release that breaks its API
# moves this and says so in the changelog, while the application's version
# tracks the release.
version = "0.0.2"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "ulo's coding agent as a library: sessions, turns, one event stream"
documentation = "https://docs.rs/ulo-sdk"
homepage = "https://ulo.sh"
repository = "https://github.com/arocomputer/ulo"
readme = "README.md"
keywords = ["agent", "coding-agent", "llm", "ai"]
categories = ["development-tools", "api-bindings"]

[lib]
# The library keeps its own name: the docs, examples, and tests are written
# against `use ulo_sdk::…`, independent of the registry package name.
name = "ulo_sdk"
path = "src/lib.rs"

[dependencies]
# The SDK drives the core directly and never links a frontend. The core's Rust
# API is internal, so each SDK release pins the version it was built and
# tested against.
ulo-core = { package = "ulo-core", path = "../core", version = "=0.0.2" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
# The integration tests share the application's test helpers, which reach the
# core through the `ulo` library. Consumers of the SDK never compile it.
ulo = { package = "ulo", path = "../cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
