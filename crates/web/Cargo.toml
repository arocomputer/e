# e's terminal in a web page: the TUI and the agent core compiled to
# WebAssembly, drawing into a terminal emulator on the page, with an
# in-memory workspace and the page's own shell. An archived experiment, not
# a product: its own workspace, so no build, check, or release of e compiles
# it. See README.md.
[package]
name = "e-web"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
e-core = { path = "../core" }
e-tui = { path = "../tui" }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
