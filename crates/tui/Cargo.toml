[package]
# The terminal frontend: painting, the transcript and composer, panels and
# pickers, and the app loop that drives a core session.
name = "e-tui"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "The terminal frontend of e, the coding agent you can put anywhere"
documentation = "https://e.aro.computer/docs"
readme = "../../README.md"
keywords = ["agent", "coding-agent", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "e_tui"

[dependencies]
e-core.workspace = true
# Typed text, cell rendering, and Markdown; e owns presentation and terminal modes.
wove = { version = "=0.0.1", git = "https://github.com/arocomputer/wove", rev = "2ca5b6dbf00eecd37c9bfbae970b54f24e1a2f06", default-features = false, features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
futures.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "io-std", "process", "signal"] }
libc.workspace = true
