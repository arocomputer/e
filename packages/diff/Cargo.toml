[package]
name = "e-diff"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Optional mouse-driven Git review extension for e"

[dependencies]
e-terminal = { version = "0.0.1", path = "../terminal" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "io-std", "io-util", "process", "fs"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = "0.2"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
