# The workspace: every crate lives under crates/, one folder per crate.
#
#   core  the terminal-free harness: agent, providers, tools, sessions
#   tui   the terminal frontend
#   rpc   the `e rpc` frontend, a JSONL session server
#   cli   the `e` binary: arguments, subcommands, and which frontend runs
#   sdk   the Rust library frontend, with its own version
#
# tui, rpc, and sdk depend on core and never on each other. fuzz/ stays its
# own workspace because cargo-fuzz requires it.
[workspace]
members = ["crates/*"]
resolver = "2"

# The application's version is the release version: the tag, `e --version`, the
# npm packages, the Homebrew formula, and the install channel all come from it.
# core, tui, rpc, and cli share it. The SDK and the Slack channel version
# themselves independently.
[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.98"
license = "MIT"
homepage = "https://e.aro.computer"
repository = "https://github.com/arocomputer/e"

[workspace.dependencies]
e-core = { package = "aro-e-core", path = "crates/core", version = "=0.0.2" }
e-tui = { package = "aro-e-tui", path = "crates/tui", version = "=0.0.2" }
e-rpc = { package = "aro-e-rpc", path = "crates/rpc", version = "=0.0.2" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "io-util", "process", "signal"] }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
regex = "1"
libc = "0.2"
proptest = "1"

# A third off the binary for zero runtime cost (measured: 8.02 -> 5.18 MiB,
# speed unchanged). Unwinding stays ON deliberately: a panicking tool is
# caught at the spawn_blocking boundary and fed back to the model as an
# error result — panic=abort would turn that into process death for ~0.9 MiB.
# Release builds slow to ~25s; dev builds are untouched.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
