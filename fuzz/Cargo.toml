[package]
name = "ulo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Cross-crate fuzzing targets the libraries directly, not the command-line wrapper.
ulo-core = { path = "../crates/core" }
ulo-tui = { path = "../crates/tui" }

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extension_protocol"
path = "fuzz_targets/extension_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize"
path = "fuzz_targets/sanitize.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
